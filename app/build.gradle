plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.klavyem.t9'
    compileSdk 34

    defaultConfig {
        applicationId "com.klavyem.t9"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    // Her derlemede aynı imza kullanılır: yeni sürüm eskisinin üstüne kurulur,
    // kelimeleriniz ve ayarlarınız silinmez.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
